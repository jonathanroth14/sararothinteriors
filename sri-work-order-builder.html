<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara Roth Interiors — Work Order Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #E0EDEB;
    --mint-light: #EDF5F3;
    --mint-pale: #F4F9F8;
    --gold: #B8943E;
    --gold-light: #CBAB56;
    --gold-dark: #9A7A2E;
    --gold-pale: #F3ECD8;
    --charcoal: #2C2E2D;
    --dark: #3A3D3C;
    --warm-gray: #7A7D7C;
    --light-gray: #C8CBCA;
    --white: #FFFFFF;
    --bg: #F7FAF9;
    --error: #C45B4A;
    --success: #5B8C6A;
    --shadow-sm: 0 1px 3px rgba(44,46,45,0.06);
    --shadow-md: 0 4px 14px rgba(44,46,45,0.09);
    --shadow-lg: 0 8px 30px rgba(44,46,45,0.13);
    --radius: 8px;
    --radius-lg: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--charcoal);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ═══ TOP BAR ═══ */
  .top-bar {
    background: var(--charcoal);
    color: var(--mint-light);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.18);
  }
  .top-bar h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--gold-light);
  }
  .top-bar-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ═══ BUTTONS ═══ */
  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 20px;
    border-radius: var(--radius);
    border: none;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    letter-spacing: 0.3px;
  }
  .btn-primary { background: var(--gold); color: white; }
  .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--mint-light); border: 1px solid rgba(255,255,255,0.18); }
  .btn-secondary:hover { background: rgba(255,255,255,0.18); }
  .btn-danger { background: transparent; color: var(--error); border: 1px solid transparent; padding: 5px 10px; font-size: 12px; }
  .btn-danger:hover { background: rgba(196,91,74,0.08); }
  .btn-ghost { background: transparent; color: var(--gold-dark); padding: 6px 12px; }
  .btn-ghost:hover { background: rgba(184,148,62,0.08); }

  /* ═══ LAYOUT ═══ */
  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; position: relative; }

  .card {
    background: var(--white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    border: 1px solid rgba(200,203,202,0.4);
    padding: 28px;
    margin-bottom: 20px;
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: var(--shadow-md); }

  .card-header {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1.5px solid var(--mint);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-header .badge {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    background: var(--gold-pale);
    color: var(--gold-dark);
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  /* ═══ FORM ELEMENTS ═══ */
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold-dark);
    margin-bottom: 6px;
  }
  input[type="text"], input[type="email"], input[type="tel"],
  input[type="date"], input[type="url"], textarea, select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #a8b8b6;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--charcoal);
    background: var(--white);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,148,62,0.12);
  }
  textarea { resize: vertical; min-height: 70px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid .full-width { grid-column: 1 / -1; }
  .job-info-print .form-grid label { margin-bottom: 2px; }
  .job-info-print .form-grid input { padding: 6px 10px; font-size: 13px; }

  /* ═══ LOGO ═══ */
  .logo-display {
    text-align: center;
    padding: 8px;
    background: transparent;
    border-radius: 0;
    border: none;
    margin-bottom: 4px;
  }
  .logo-display img { max-height: 110px; max-width: 80%; object-fit: contain; }

  .wo-title-input {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    border: none;
    border-bottom: 2px solid var(--light-gray);
    background: transparent;
    padding: 4px 16px;
    width: 100%;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--charcoal);
  }
  .wo-title-input:focus { border-bottom-color: var(--gold); outline: none; }
  .gold-divider { height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 4px auto; width: 60%; }

  /* ═══ ROOM CARD ═══ */
  .room-card {
    background: transparent;
    border-radius: 0;
    box-shadow: none;
    border: none;
    margin-bottom: 32px;
    overflow: visible;
    border-bottom: 2px solid var(--mint);
    padding-bottom: 24px;
  }
  .room-card:hover { box-shadow: none; }
  .room-header {
    padding: 0 0 12px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--mint);
    margin-bottom: 16px;
  }
  .room-header-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .room-name-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--light-gray);
    border-radius: 0;
    padding: 4px 4px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--charcoal);
    outline: none;
  }
  .room-name-input:focus { border-bottom-color: var(--gold); }
  .room-name-input::placeholder { color: var(--light-gray); }
  .room-name-input::selection { background: var(--gold-pale); }
  .room-body { padding: 0; }

  /* ═══ ITEM CARD ═══ */
  .item-card {
    border: none;
    border-radius: 0;
    margin-bottom: 14px;
    overflow: hidden;
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--light-gray);
  }
  .item-card:last-of-type { border-bottom: none; padding-bottom: 0; }
  .item-card:hover { border-color: var(--light-gray); }
  .item-header {
    display: flex;
    align-items: center;
    padding: 6px 0;
    gap: 10px;
    margin-bottom: 8px;
  }
  .item-tag {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--gold-dark);
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .item-name-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--light-gray);
    border-radius: 0;
    padding: 5px 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--charcoal);
    outline: none;
  }
  .item-name-input:focus { border-bottom-color: var(--gold); }
  .item-name-input::placeholder { color: var(--light-gray); }

  /* ═══ TWO COLUMN LAYOUT ═══ */
  .item-body {
    display: flex;
    min-height: 120px;
    position: relative;
  }
  .item-col-details {
    flex: 1;
    padding: 14px;
    min-width: 200px;
    overflow: hidden;
  }
  .item-col-images {
    flex: 1;
    padding: 14px;
    min-width: 150px;
    background: transparent;
    border-left: 1px dashed var(--light-gray);
    overflow: hidden;
  }
  .col-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--warm-gray);
    margin-bottom: 10px;
  }

  /* ═══ RESIZE HANDLE ═══ */
  .resize-handle {
    width: 8px;
    cursor: col-resize;
    background: var(--mint);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .resize-handle:hover, .resize-handle.active {
    background: var(--gold);
  }
  .resize-handle::after {
    content: '⋮';
    color: var(--warm-gray);
    font-size: 14px;
    line-height: 1;
  }
  .resize-handle:hover::after, .resize-handle.active::after { color: white; }

  /* ═══ DETAIL FIELDS ═══ */
  .field-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 4px;
    padding: 2px 0;
    border: none;
    transition: background 0.15s;
  }
  .field-row:hover { background: transparent; }

  .field-label-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    border: none;
    border-bottom: 1px dashed var(--light-gray);
    background: transparent;
    padding: 2px 3px;
    color: var(--dark);
    flex-shrink: 0;
    resize: none;
    overflow: hidden;
    line-height: 1.3;
    height: auto;
    display: block;
    vertical-align: top;
  }
  .field-label-input:focus { border-bottom-color: var(--gold); outline: none; }

  .label-resize-handle {
    width: 6px;
    cursor: col-resize;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .field-row:hover .label-resize-handle { opacity: 0.5; }
  .label-resize-handle:hover, .label-resize-handle.active { opacity: 1 !important; }
  .label-resize-handle::after {
    content: '⋮';
    color: var(--light-gray);
    font-size: 12px;
    line-height: 1;
  }
  .label-resize-handle:hover::after, .label-resize-handle.active::after { color: var(--gold); }

  .field-value-wrap {
    flex: 1;
    min-width: 0;
    border: none;
    border-bottom: 1px solid var(--light-gray);
    background: transparent;
    padding: 2px 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--charcoal);
    transition: border-color 0.2s;
    resize: none;
    overflow: hidden;
    line-height: 1.3;
    height: auto;
    display: block;
    vertical-align: top;
  }
  .field-value-wrap:focus { border-bottom-color: var(--gold); outline: none; }

  .field-textarea {
    flex: 1;
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--light-gray);
    border-radius: 0;
    background: transparent;
    padding: 5px 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--charcoal);
    resize: vertical;
    min-height: 50px;
  }
  .field-textarea:focus { border-bottom-color: var(--gold); outline: none; }

  .field-remove-btn {
    background: none; border: none; color: var(--light-gray); cursor: pointer;
    padding: 2px; font-size: 16px; line-height: 1; transition: color 0.15s; flex-shrink: 0;
  }
  .field-remove-btn:hover { color: var(--error); }

  /* ═══ FONT CONTROLS ═══ */
  .font-toolbar {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
    flex-wrap: wrap;
    font-size: 11px;
  }
  .field-row:focus-within .font-toolbar { display: flex; }
  .font-toolbar-group {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 2px 6px;
    background: var(--mint-pale);
    border-radius: 4px;
    border: 1px solid var(--mint);
  }
  .font-toolbar-group-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--warm-gray);
    margin-right: 4px;
  }
  .font-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 3px;
    cursor: pointer;
    padding: 1px 5px;
    font-size: 12px;
    color: var(--warm-gray);
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
    line-height: 1.4;
  }
  .font-btn:hover { background: var(--mint-light); color: var(--dark); }
  .font-btn.active { background: var(--gold-pale); color: var(--gold-dark); border-color: var(--gold); }
  .font-size-select {
    width: 44px;
    padding: 1px 2px;
    font-size: 11px;
    border: 1px solid var(--mint);
    border-radius: 3px;
    background: var(--white);
    color: var(--dark);
    cursor: pointer;
    text-align: center;
    font-family: 'DM Sans', sans-serif;
  }
  .font-size-select:focus { border-color: var(--gold); outline: none; }

  /* ═══ IMAGE SLOTS (Right Column) ═══ */
  .image-slot {
    margin-bottom: 12px;
    position: relative;
  }
  .image-slot-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .image-slot-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    border: none;
    border-bottom: 1px dashed var(--light-gray);
    background: transparent;
    padding: 3px 2px;
    color: var(--dark);
    width: 100%;
    text-overflow: ellipsis;
  }
  .image-slot-label:focus { border-bottom-color: var(--gold); outline: none; }

  .image-drop-zone {
    border: 1.5px dashed var(--light-gray);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
    cursor: pointer;
    font-size: 12px;
    color: var(--warm-gray);
    transition: all 0.2s;
    background: transparent;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    overflow: hidden;
  }
  .image-drop-zone:hover, .image-drop-zone.dragover {
    border-color: var(--gold);
    background: rgba(184,148,62,0.03);
  }
  .image-drop-zone.has-image {
    border: none;
    padding: 0;
    display: block;
    min-height: auto;
  }
  .image-drop-zone img {
    max-width: 100%;
    border-radius: 4px;
    object-fit: contain;
    display: inline-block;
  }

  /* ═══ CROP TOOL ═══ */
  .crop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .crop-container {
    position: relative;
    max-width: 90vw;
    max-height: 70vh;
    overflow: hidden;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
  }
  .crop-container img {
    display: block;
    max-width: 90vw;
    max-height: 70vh;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
  }
  .crop-selection {
    position: absolute;
    border: 2px dashed var(--gold);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .crop-actions {
    display: flex;
    gap: 10px;
  }
  .crop-actions button {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 28px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .crop-apply { background: var(--gold); color: white; }
  .crop-apply:hover { background: var(--gold-light); }
  .crop-cancel { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3) !important; }
  .crop-cancel:hover { background: rgba(255,255,255,0.25); }
  .crop-hint { color: rgba(255,255,255,0.6); font-size: 12px; }

  .image-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 11px;
    color: var(--dark);
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .image-controls label { font-size: 10px; margin-bottom: 0; display: inline; }
  .image-controls input[type="range"] {
    width: 80px; accent-color: var(--gold); border: none; padding: 0;
  }
  .image-controls select { width: auto; padding: 3px 6px; font-size: 11px; border: 1px solid var(--mint); border-radius: 4px; }
  .scale-value { font-weight: 600; color: var(--gold-dark); min-width: 30px; text-align: center; font-size: 11px; }

  .image-url-row {
    display: flex; gap: 4px; align-items: center; margin-top: 6px;
  }
  .image-url-row input { flex: 1; font-size: 11px; padding: 5px 8px; }
  .or-divider { font-size: 10px; color: var(--light-gray); text-align: center; font-weight: 600; letter-spacing: 1px; margin-top: 6px; }

  /* ═══ ADD BUTTONS ═══ */
  .add-btn-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .add-field-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1.5px dashed var(--light-gray);
    background: transparent;
    color: var(--gold-dark);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .add-field-btn:hover { border-color: var(--gold); background: rgba(184,148,62,0.06); border-style: solid; }

  .add-item-btn {
    width: 100%;
    padding: 10px;
    border: 2px dashed var(--light-gray);
    border-radius: var(--radius);
    background: transparent;
    color: var(--gold-dark);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 6px;
  }
  .add-item-btn:hover { border-color: var(--gold); background: rgba(184,148,62,0.04); }

  .add-room-area {
    border: 2px dashed var(--light-gray);
    border-radius: var(--radius-lg);
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    color: var(--gold-dark);
    font-weight: 600;
    font-size: 14px;
  }
  .add-room-area:hover { border-color: var(--gold); background: rgba(184,148,62,0.04); }

  /* ═══ DRAFTS PANEL ═══ */
  .drafts-panel {
    position: fixed; top: 0; right: -380px; width: 380px; height: 100%;
    background: var(--white); box-shadow: -4px 0 30px rgba(0,0,0,0.15);
    z-index: 200; transition: right 0.3s ease; display: flex; flex-direction: column;
  }
  .drafts-panel.open { right: 0; }
  .drafts-panel-header {
    padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--charcoal); color: var(--mint-light);
  }
  .drafts-panel-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; color: var(--gold-light); }
  .drafts-list { flex: 1; overflow-y: auto; padding: 16px; }
  .draft-item {
    padding: 14px 16px; border: 1px solid var(--mint); border-radius: var(--radius);
    margin-bottom: 10px; cursor: pointer; transition: all 0.2s; background: var(--white);
  }
  .draft-item:hover { border-color: var(--gold); box-shadow: var(--shadow-sm); }
  .draft-item-title { font-weight: 600; font-size: 14px; color: var(--charcoal); margin-bottom: 4px; }
  .draft-item-meta { font-size: 11px; color: var(--warm-gray); }
  .draft-item-actions { display: flex; gap: 6px; margin-top: 8px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 199; display: none; opacity: 0; transition: opacity 0.3s; }
  .overlay.visible { display: block; opacity: 1; }

  .empty-hint { text-align: center; padding: 16px; color: var(--warm-gray); font-size: 12px; font-style: italic; }

  /* ═══ TOAST ═══ */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--charcoal); color: white; padding: 12px 24px; border-radius: var(--radius);
    font-size: 13px; font-weight: 500; z-index: 300; transition: transform 0.3s ease, opacity 0.3s;
    opacity: 0; box-shadow: var(--shadow-lg);
  }
  .toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ═══ PAGE BREAK INDICATOR ═══ */
  .page-break-indicator {
    position: absolute; left: -32px; right: -32px; height: 0;
    border-top: 2px dashed rgba(184,148,62,0.45);
    pointer-events: none; z-index: 50;
  }
  .page-break-indicator-label {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: -11px; font-size: 10px; font-weight: 700;
    font-family: 'DM Sans', sans-serif; letter-spacing: 1px;
    color: var(--gold-dark); background: var(--bg);
    padding: 0 8px; white-space: nowrap;
  }

  /* ═══ PRINT ═══ */
  /* @page must be at top level — placing it inside @media print is invalid and ignored by Safari */
  @page { margin: 0.25in; }
  @media print {
    .top-bar, .add-btn-row, .add-item-btn, .add-room-area, .field-remove-btn,
    .btn, .drafts-panel, .overlay, .toast, .no-print, .image-url-row,
    .or-divider, .image-controls, .resize-handle, .col-label, .font-controls, .font-toolbar, .label-resize-handle, .page-break-indicator { display: none !important; }
    body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .container { max-width: 100%; padding: 0; }
    .card { box-shadow: none; border: none; padding: 0; margin-bottom: 0; }
    .card-header { font-size: 14px; margin-bottom: 4px; padding-bottom: 2px; }
    .card-header .badge { display: none; }
    .logo-display { padding: 0; margin-bottom: 0; border: none; background: none; }
    .logo-display img { max-height: 80px; }
    .gold-divider { display: none; }
    .wo-title-input { font-size: 14px; padding: 0 8px; margin: 0; letter-spacing: 2px; border: none !important; }
    .form-grid { gap: 2px; }
    label { font-size: 8px; margin-bottom: 0; }
    input[type="text"], input[type="email"], input[type="tel"],
    input[type="date"], input[type="url"], textarea, select {
      padding: 2px 8px; font-size: 12px; border-width: 1px;
      overflow: visible !important;
      height: auto !important;
      max-height: none !important;
      white-space: pre-wrap !important;
    }
    .room-card { box-shadow: none; margin-bottom: 16px; page-break-inside: auto; break-inside: auto; border-bottom: 1px solid #ccc; padding-bottom: 12px; }
    .room-header { padding: 0 0 6px 0; margin-bottom: 8px; border-bottom: 1px solid #ddd; }
    .room-header-label { font-size: 11px; }
    .room-name-input { font-size: 18px; padding: 2px; }
    .room-body { padding: 0; }
    /* Items flow freely across pages; only image slots are kept together */
    .item-card { page-break-inside: auto; break-inside: auto; margin-bottom: 8px; border-bottom: 1px dashed #ddd; }
    .image-slot { page-break-inside: avoid; break-inside: avoid; }
    /* Force all textareas to show full content - no scrollbars */
    textarea, .field-value-wrap, .field-textarea, .field-label-input {
      overflow: visible !important;
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      resize: none !important;
      white-space: pre-wrap !important;
      -webkit-appearance: none !important;
    }
    /* Job info flows naturally — no forced break, items follow immediately on the same page */
    .job-info-print { page-break-after: auto; break-after: auto; }

    /* Job info section stands apart in print */
    .job-info-print {
      border: 2px solid var(--gold) !important;
      padding: 6px 12px !important;
      margin-bottom: 8px !important;
      background: #f5f9f8 !important;
    }
    .job-info-print .card-header {
      color: #9A7A2E !important;
      border-bottom: 2px solid #B8943E !important;
      font-size: 14px !important;
      margin-bottom: 4px !important;
      padding-bottom: 2px !important;
    }
    .job-info-print label { color: #9A7A2E !important; }
    .job-info-print input {
      background: white !important;
      color: #2C2E2D !important;
      border-color: #ddd !important;
      padding: 1px 6px !important;
    }
    .item-header { padding: 5px 10px; }
    .item-tag { font-size: 13px; }
    .item-name-input { font-size: 14px; font-weight: 700; padding: 3px 4px; }
    .item-body { min-height: auto; }
    .item-col-details { padding: 8px; }
    .item-col-images { padding: 8px; }
    .field-row { padding: 1px 0; margin-bottom: 2px; }
    .field-label-input { font-size: 10px; padding: 1px; max-width: none; overflow: visible !important; height: auto !important; }
    .field-value-wrap { padding: 1px; overflow: visible !important; height: auto !important; max-height: none !important; }
    .field-textarea { padding: 2px; overflow: visible !important; height: auto !important; max-height: none !important; }
    .image-drop-zone { padding: 4px; min-height: auto; border-style: solid; }
    .image-slot { margin-bottom: 6px; }
    .image-slot-label { font-size: 9px; }
    input::placeholder, textarea::placeholder { color: transparent !important; }
    .item-name-input::placeholder, .room-name-input::placeholder,
    .field-label-input::placeholder, .field-value-wrap::placeholder,
    .image-slot-label::placeholder { color: transparent !important; }
    /* Force all entered text to print black */
    input, textarea, .field-label-input, .field-value-wrap, .field-textarea,
    .item-name-input, .wo-title-input, .image-slot-label,
    .item-tag, .room-header-label, .card-header {
      color: #000 !important;
    }
    .job-info-print input { color: #000 !important; }
    /* Print swap divs replace textareas */
    .print-swap {
      border: none !important;
      background: transparent !important;
      padding: 1px 3px !important;
      overflow: visible !important;
      white-space: pre-wrap !important;
      word-wrap: break-word !important;
      color: #000 !important;
    }
  }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .top-bar { padding: 10px 14px; flex-wrap: wrap; gap: 6px; }
    .top-bar h1 { font-size: 14px; letter-spacing: 1px; }
    .top-bar-actions { flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .top-bar-actions .btn { padding: 7px 10px; font-size: 12px; }
    .container { padding: 16px 12px 60px; }
    .card { padding: 20px 16px; }
    .item-body { flex-direction: column; }
    .item-col-images { border-left: none; border-top: 1px solid var(--mint); }
    .resize-handle { display: none; }
  }
</style>
</head>
<body spellcheck="true">

<div class="top-bar">
  <h1>SARA ROTH INTERIORS</h1>
  <div class="top-bar-actions">
    <button class="btn btn-secondary" onclick="toggleDrafts()">📁 Drafts</button>
    <button class="btn btn-secondary" onclick="saveDraft()">💾 Save</button>
    <button class="btn btn-secondary" onclick="clearForm()">🗑️ New</button>
    <button class="btn btn-secondary no-print" id="pageBreakBtn" onclick="togglePageBreaks()">📄 Pages</button>
    <button class="btn btn-secondary" onclick="window.print()">🖨️ Print</button>
    <button class="btn btn-primary" onclick="exportXLSX()">📤 Export XLSX</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="toggleDrafts()"></div>
<div class="drafts-panel" id="draftsPanel">
  <div class="drafts-panel-header">
    <h2>Saved Drafts</h2>
    <button class="btn btn-secondary" onclick="toggleDrafts()" style="padding:6px 12px;">✕ Close</button>
  </div>
  <div class="drafts-list" id="draftsList"><div class="empty-hint">No saved drafts yet</div></div>
  <div style="padding:12px 16px; border-top:1px solid var(--mint); display:flex; gap:8px;">
    <button class="btn btn-primary" style="flex:1;font-size:12px;padding:8px;" onclick="exportDrafts()">📥 Export All Drafts</button>
    <button class="btn btn-ghost" style="flex:1;font-size:12px;padding:8px;border:1px solid var(--mint);" onclick="document.getElementById('importDraftsFile').click()">📤 Import Drafts</button>
    <input type="file" id="importDraftsFile" accept=".json" style="display:none;" onchange="importDrafts(event)">
  </div>
</div>

<div class="container">
  <!-- Logo & Title -->
  <div class="card" style="text-align:center; border:none; box-shadow:none; padding:12px 28px; margin-bottom:8px;">
    <div class="logo-display">
      <img id="logoImg" src="" alt="Sara Roth Interiors">
    </div>
    <div class="gold-divider"></div>
    <div style="margin-top:4px;">
      <input type="text" class="wo-title-input" id="woTitle" value="WINDOW TREATMENT WORK ORDER" placeholder="Work Order Title">
    </div>
  </div>

  <!-- Job Info -->
  <div class="card job-info-print" style="background:var(--mint-light); border: 1.5px solid var(--gold); padding:16px 20px; margin-bottom:16px;">
    <div class="card-header" style="color:var(--gold-dark); border-bottom-color:var(--gold); margin-bottom:10px; padding-bottom:8px; font-size:16px;">
      Job Information
    </div>
    <div class="form-grid" style="gap:8px;">
      <div><label style="color:var(--gold-dark);">Job Name</label><input type="text" id="jobName" placeholder="e.g. Smith Residence" style="background:var(--white);border-color:var(--mint);"></div>
      <div><label style="color:var(--gold-dark);">Room</label><input type="text" id="roomName" placeholder="e.g. Nursery, Living Room" style="background:var(--white);border-color:var(--mint);"></div>
      <div><label style="color:var(--gold-dark);">Email</label><input type="email" id="email" placeholder="e.g. saraeroth5@gmail.com" value="saraeroth5@gmail.com" style="background:var(--white);border-color:var(--mint);"></div>
      <div><label style="color:var(--gold-dark);">Date</label><input type="date" id="orderDate" style="background:var(--white);border-color:var(--mint);"></div>
      <div><label style="color:var(--gold-dark);">Client Phone</label><input type="tel" id="clientPhone" placeholder="(555) 123-4567" style="background:var(--white);border-color:var(--mint);"></div>
      <div><label style="color:var(--gold-dark);">Designer</label><input type="text" id="designer" placeholder="e.g. Sara" value="Sara Roth" style="background:var(--white);border-color:var(--mint);"></div>
      <div class="full-width"><label style="color:var(--gold-dark);">Install Address / Installer</label><input type="text" id="installAddress" placeholder="e.g. 123 Main St, Dallas TX / Will pick up" style="background:var(--white);border-color:var(--mint);"></div>
    </div>
  </div>

  <!-- Items -->
  <div id="itemsContainer"></div>
  <div class="add-room-area" onclick="addItem()">＋ Add Item</div>
</div>

<div class="toast" id="toast"></div>

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let state = { items: [] };
let idCounter = 0;
function newId() { return ++idCounter; }

// ═══════════════════════════════════════
// ITEM MANAGEMENT
// ═══════════════════════════════════════
function addItem() {
  state.items.push({ id: newId(), name: '', splitPercent: 50, fields: [], images: [] });
  render();
  showToast('Item added');
}

function removeItem(itemId) {
  if (!confirm('Remove this item?')) return;
  state.items = state.items.filter(i => i.id !== itemId);
  render();
}

function updateItemName(itemId, name) {
  const item = state.items.find(i => i.id === itemId);
  if (item) item.name = name;
}

// ═══════════════════════════════════════
// FIELD MANAGEMENT (left column)
// ═══════════════════════════════════════
function addField(itemId, type, label, value) {
  const item = getItem(itemId);
  if (!item) return;
  const f = { id: newId(), type, label: label||'', value: value||'', bold: false, italic: false, underline: false, fontSize: 14, lBold: true, lItalic: false, lUnderline: false, lFontSize: 12, labelWidth: 120 };
  if (type === 'image') { f.imageData = null; f.imageScale = 100; f.imageAlign = 'center'; }
  item.fields.push(f);
  render();
}

function removeField(itemId, fieldId) {
  const item = getItem(itemId);
  if (!item) return;
  item.fields = item.fields.filter(f => f.id !== fieldId);
  render();
}

function updateField(itemId, fieldId, key, val) {
  const item = getItem(itemId);
  if (!item) return;
  const f = item.fields.find(f => f.id === fieldId);
  if (f) f[key] = val;
}

function toggleFormat(itemId, fieldId, prop) {
  const item = getItem(itemId);
  if (!item) return;
  const f = item.fields.find(f => f.id === fieldId);
  if (!f) return;
  f[prop] = !f[prop];
  const isLabel = prop.startsWith('l');
  const elKey = isLabel ? `data-lbl` : `data-val`;
  const el = document.querySelector(`[${elKey}="${fieldId}"]`);
  const btn = document.querySelector(`[data-fmt="${fieldId}-${prop}"]`);
  if (el) {
    const base = prop.replace(/^l/, '').toLowerCase();
    if (base === 'bold') el.style.fontWeight = f[prop] ? '700' : '400';
    if (base === 'italic') el.style.fontStyle = f[prop] ? 'italic' : 'normal';
    if (base === 'underline') el.style.textDecoration = f[prop] ? 'underline' : 'none';
  }
  if (btn) btn.classList.toggle('active', f[prop]);
}

function setFontSize(itemId, fieldId, size, target) {
  const item = getItem(itemId);
  if (!item) return;
  const f = item.fields.find(f => f.id === fieldId);
  if (!f) return;
  const isLabel = target === 'label';
  if (isLabel) f.lFontSize = parseInt(size);
  else f.fontSize = parseInt(size);
  const elKey = isLabel ? 'data-lbl' : 'data-val';
  const el = document.querySelector(`[${elKey}="${fieldId}"]`);
  if (el) {
    el.style.fontSize = size + 'px';
    autoSize(el);
  }
}

// ═══════════════════════════════════════
// IMAGE MANAGEMENT (right column)
// ═══════════════════════════════════════
function addImageSlot(itemId) {
  const item = getItem(itemId);
  if (!item) return;
  item.images.push({ id: newId(), label: '', imageData: null, scale: 100, align: 'center', url: '' });
  render();
}

function removeImageSlot(itemId, imgId) {
  const item = getItem(itemId);
  if (!item) return;
  item.images = item.images.filter(i => i.id !== imgId);
  render();
}

function updateImageSlot(itemId, imgId, key, val) {
  const item = getItem(itemId);
  if (!item) return;
  const img = item.images.find(i => i.id === imgId);
  if (img) img[key] = val;
}

function handleImageDrop(e, itemId, imgId) {
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) processImage(file, itemId, imgId);
}

function handleImageSelect(e, itemId, imgId) {
  const file = e.target.files[0];
  if (file) processImage(file, itemId, imgId);
}

function processImage(file, itemId, imgId) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    const item = getItem(itemId);
    if (!item) return;
    const img = item.images.find(i => i.id === imgId);
    if (img) { img.imageData = ev.target.result; img.url = file.name; render(); }
  };
  reader.readAsDataURL(file);
}

function loadImageURL(itemId, imgId) {
  const item = getItem(itemId);
  if (!item) return;
  const imgSlot = item.images.find(i => i.id === imgId);
  if (!imgSlot || !imgSlot.url) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    try { imgSlot.imageData = c.toDataURL('image/png'); } catch(e) { imgSlot.imageData = imgSlot.url; }
    render(); showToast('Image loaded');
  };
  img.onerror = () => showToast('Could not load image');
  img.src = imgSlot.url;
}

function updateImageScale(itemId, imgId, val) {
  updateImageSlot(itemId, imgId, 'scale', parseInt(val));
  const el = document.querySelector(`[data-img="${imgId}"]`);
  const lbl = document.querySelector(`[data-scale="${imgId}"]`);
  if (el) el.style.width = val + '%';
  if (lbl) lbl.textContent = val + '%';
}

function updateImageAlign(itemId, imgId, val) {
  updateImageSlot(itemId, imgId, 'align', val);
  const wrap = document.querySelector(`[data-imgwrap="${imgId}"]`);
  if (wrap) wrap.style.textAlign = val;
}

// ═══════════════════════════════════════
// CROP TOOL
// ═══════════════════════════════════════
let cropState = null;

function openCrop(itemId, imgId) {
  const item = getItem(itemId);
  if (!item) return;
  const imgSlot = item.images.find(i => i.id === imgId);
  if (!imgSlot || !imgSlot.imageData) return;

  const overlay = document.createElement('div');
  overlay.className = 'crop-overlay';
  overlay.innerHTML = `
    <div class="crop-hint">Click and drag to select crop area</div>
    <div class="crop-container" id="cropContainer">
      <img id="cropImg" src="${imgSlot.imageData}">
      <div class="crop-selection" id="cropSelection" style="display:none;"></div>
    </div>
    <div class="crop-actions">
      <button class="crop-cancel" onclick="closeCrop()">Cancel</button>
      <button class="crop-apply" onclick="applyCrop()">Apply Crop</button>
    </div>`;
  document.body.appendChild(overlay);

  cropState = { itemId, imgId, overlay, startX: 0, startY: 0, dragging: false };

  const container = document.getElementById('cropContainer');
  const img = document.getElementById('cropImg');

  img.onload = () => {
    cropState.imgW = img.naturalWidth;
    cropState.imgH = img.naturalHeight;
    cropState.dispW = img.clientWidth;
    cropState.dispH = img.clientHeight;
  };
  if (img.complete) {
    cropState.imgW = img.naturalWidth;
    cropState.imgH = img.naturalHeight;
    setTimeout(() => {
      cropState.dispW = img.clientWidth;
      cropState.dispH = img.clientHeight;
    }, 50);
  }

  container.addEventListener('mousedown', cropMouseDown);
  container.addEventListener('mousemove', cropMouseMove);
  container.addEventListener('mouseup', cropMouseUp);
  container.addEventListener('dragstart', e => e.preventDefault());
}

function cropMouseDown(e) {
  e.preventDefault();
  if (!cropState) return;
  const rect = e.currentTarget.getBoundingClientRect();
  cropState.startX = e.clientX - rect.left;
  cropState.startY = e.clientY - rect.top;
  cropState.dragging = true;
  const sel = document.getElementById('cropSelection');
  sel.style.display = 'block';
  sel.style.left = cropState.startX + 'px';
  sel.style.top = cropState.startY + 'px';
  sel.style.width = '0';
  sel.style.height = '0';
}

function cropMouseMove(e) {
  e.preventDefault();
  if (!cropState || !cropState.dragging) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const curX = Math.max(0, Math.min(e.clientX - rect.left, cropState.dispW));
  const curY = Math.max(0, Math.min(e.clientY - rect.top, cropState.dispH));
  const sel = document.getElementById('cropSelection');
  const x = Math.min(cropState.startX, curX);
  const y = Math.min(cropState.startY, curY);
  const w = Math.abs(curX - cropState.startX);
  const h = Math.abs(curY - cropState.startY);
  sel.style.left = x + 'px';
  sel.style.top = y + 'px';
  sel.style.width = w + 'px';
  sel.style.height = h + 'px';
  cropState.cropX = x;
  cropState.cropY = y;
  cropState.cropW = w;
  cropState.cropH = h;
}

function cropMouseUp(e) {
  if (!cropState) return;
  cropState.dragging = false;
}

function applyCrop() {
  if (!cropState || !cropState.cropW || cropState.cropW < 5) {
    showToast('Please draw a crop area first');
    return;
  }
  const { itemId, imgId, cropX, cropY, cropW, cropH, dispW, dispH, imgW, imgH } = cropState;
  const scaleX = imgW / dispW;
  const scaleY = imgH / dispH;
  const sx = Math.round(cropX * scaleX);
  const sy = Math.round(cropY * scaleY);
  const sw = Math.round(cropW * scaleX);
  const sh = Math.round(cropH * scaleY);

  const item = getItem(itemId);
  if (!item) { closeCrop(); return; }
  const imgSlot = item.images.find(i => i.id === imgId);
  if (!imgSlot) { closeCrop(); return; }

  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
    const ext = imgSlot.imageData.includes('image/png') ? 'image/png' : 'image/jpeg';
    imgSlot.imageData = c.toDataURL(ext);
    closeCrop();
    render();
    showToast('Image cropped');
  };
  img.src = imgSlot.imageData;
}

function closeCrop() {
  if (cropState && cropState.overlay) {
    cropState.overlay.remove();
  }
  cropState = null;
}

function getItem(itemId) {
  return state.items.find(i => i.id === itemId);
}

// ═══════════════════════════════════════
// DETAIL-COLUMN IMAGE FIELDS
// ═══════════════════════════════════════
function handleFieldImageDrop(e, itemId, fieldId) {
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) processFieldImage(file, itemId, fieldId);
}

function handleFieldImageSelect(e, itemId, fieldId) {
  const file = e.target.files[0];
  if (file) processFieldImage(file, itemId, fieldId);
}

function processFieldImage(file, itemId, fieldId) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    const item = getItem(itemId);
    if (!item) return;
    const f = item.fields.find(f => f.id === fieldId);
    if (f) { f.imageData = ev.target.result; render(); }
  };
  reader.readAsDataURL(file);
}

function updateFieldImageScale(itemId, fieldId, val) {
  const item = getItem(itemId);
  if (!item) return;
  const f = item.fields.find(f => f.id === fieldId);
  if (f) f.imageScale = parseInt(val);
  const el = document.querySelector(`[data-fimg="${fieldId}"]`);
  const lbl = document.querySelector(`[data-fscale="${fieldId}"]`);
  if (el) el.style.width = val + '%';
  if (lbl) lbl.textContent = val + '%';
}

function updateFieldImageAlign(itemId, fieldId, val) {
  const item = getItem(itemId);
  if (!item) return;
  const f = item.fields.find(f => f.id === fieldId);
  if (f) f.imageAlign = val;
  const wrap = document.querySelector(`[data-fimgwrap="${fieldId}"]`);
  if (wrap) wrap.style.textAlign = val;
}

function openFieldCrop(itemId, fieldId) {
  const item = getItem(itemId);
  if (!item) return;
  const f = item.fields.find(f => f.id === fieldId);
  if (!f || !f.imageData) return;

  const overlay = document.createElement('div');
  overlay.className = 'crop-overlay';
  overlay.innerHTML = `
    <div class="crop-hint">Click and drag to select crop area</div>
    <div class="crop-container" id="cropContainer">
      <img id="cropImg" src="${f.imageData}">
      <div class="crop-selection" id="cropSelection" style="display:none;"></div>
    </div>
    <div class="crop-actions">
      <button class="crop-cancel" onclick="closeCrop()">Cancel</button>
      <button class="crop-apply" onclick="applyFieldCrop()">Apply Crop</button>
    </div>`;
  document.body.appendChild(overlay);

  cropState = { itemId, fieldId, isField: true, overlay, startX: 0, startY: 0, dragging: false };

  const container = document.getElementById('cropContainer');
  const img = document.getElementById('cropImg');

  img.onload = () => {
    cropState.imgW = img.naturalWidth;
    cropState.imgH = img.naturalHeight;
    cropState.dispW = img.clientWidth;
    cropState.dispH = img.clientHeight;
  };
  if (img.complete) {
    cropState.imgW = img.naturalWidth;
    cropState.imgH = img.naturalHeight;
    setTimeout(() => {
      cropState.dispW = img.clientWidth;
      cropState.dispH = img.clientHeight;
    }, 50);
  }

  container.addEventListener('mousedown', cropMouseDown);
  container.addEventListener('mousemove', cropMouseMove);
  container.addEventListener('mouseup', cropMouseUp);
  container.addEventListener('dragstart', e => e.preventDefault());
}

function applyFieldCrop() {
  if (!cropState || !cropState.cropW || cropState.cropW < 5) {
    showToast('Please draw a crop area first');
    return;
  }
  const { itemId, fieldId, cropX, cropY, cropW, cropH, dispW, dispH, imgW, imgH } = cropState;
  const scaleX = imgW / dispW;
  const scaleY = imgH / dispH;
  const sx = Math.round(cropX * scaleX);
  const sy = Math.round(cropY * scaleY);
  const sw = Math.round(cropW * scaleX);
  const sh = Math.round(cropH * scaleY);

  const item = getItem(itemId);
  if (!item) { closeCrop(); return; }
  const f = item.fields.find(f => f.id === fieldId);
  if (!f) { closeCrop(); return; }

  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
    const ext = f.imageData.includes('image/png') ? 'image/png' : 'image/jpeg';
    f.imageData = c.toDataURL(ext);
    closeCrop();
    render();
    showToast('Image cropped');
  };
  img.src = f.imageData;
}

// ═══════════════════════════════════════
// RESIZE COLUMNS
// ═══════════════════════════════════════
let resizeState = null;

function startResize(e, itemId) {
  e.preventDefault();
  const itemBody = e.target.closest('.item-body');
  const item = getItem(itemId);
  if (!itemBody || !item) return;
  const rect = itemBody.getBoundingClientRect();
  e.target.classList.add('active');
  resizeState = { itemId, itemBody, startX: rect.left, totalW: rect.width, handle: e.target };
  document.addEventListener('mousemove', onResize);
  document.addEventListener('mouseup', stopResize);
}

function onResize(e) {
  if (!resizeState) return;
  const { itemBody, startX, totalW, itemId } = resizeState;
  const pct = Math.min(85, Math.max(15, ((e.clientX - startX) / totalW) * 100));
  const item = getItem(itemId);
  if (item) item.splitPercent = pct;
  const detCol = itemBody.querySelector('.item-col-details');
  const imgCol = itemBody.querySelector('.item-col-images');
  if (detCol) detCol.style.flex = `0 0 ${pct}%`;
  if (imgCol) imgCol.style.flex = `0 0 ${100 - pct}%`;
}

function stopResize() {
  if (resizeState && resizeState.handle) resizeState.handle.classList.remove('active');
  resizeState = null;
  document.removeEventListener('mousemove', onResize);
  document.removeEventListener('mouseup', stopResize);
}

// ═══════════════════════════════════════
// LABEL WIDTH RESIZE
// ═══════════════════════════════════════
let labelResizeState = null;

function startLabelResize(e, itemId, fieldId) {
  e.preventDefault();
  const row = e.target.closest('.field-row');
  if (!row) return;
  e.target.classList.add('active');
  labelResizeState = { itemId, fieldId, row, startX: e.clientX, handle: e.target };
  const item = getItem(itemId);
  const f = item ? item.fields.find(f => f.id === fieldId) : null;
  if (f) labelResizeState.startW = f.labelWidth || 120;
  document.addEventListener('mousemove', onLabelResize);
  document.addEventListener('mouseup', stopLabelResize);
}

function onLabelResize(e) {
  if (!labelResizeState) return;
  const { itemId, fieldId, startX, startW } = labelResizeState;
  const delta = e.clientX - startX;
  const newW = Math.min(400, Math.max(50, startW + delta));
  const item = getItem(itemId);
  if (!item) return;
  const f = item.fields.find(f => f.id === fieldId);
  if (f) f.labelWidth = newW;
  const lbl = document.querySelector(`[data-lbl="${fieldId}"]`);
  if (lbl) {
    lbl.style.width = newW + 'px';
    lbl.style.minWidth = newW + 'px';
    lbl.style.maxWidth = newW + 'px';
  }
}

function stopLabelResize() {
  if (labelResizeState && labelResizeState.handle) labelResizeState.handle.classList.remove('active');
  labelResizeState = null;
  document.removeEventListener('mousemove', onLabelResize);
  document.removeEventListener('mouseup', stopLabelResize);
}

// ═══════════════════════════════════════
// AUTO-SIZE TEXTAREAS
// ═══════════════════════════════════════
function autoSize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function autoSizeAll() {
  document.querySelectorAll('.field-label-input, .field-value-wrap, .field-textarea').forEach(el => autoSize(el));
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render() {
  const container = document.getElementById('itemsContainer');
  container.innerHTML = '';
  state.items.forEach((item, idx) => {
    const el = document.createElement('div');
    el.innerHTML = renderItem(item, idx);
    container.appendChild(el.firstElementChild);
  });
  // Auto-size all wrapping textareas after DOM update
  requestAnimationFrame(() => autoSizeAll());
}

function renderItem(item, idx) {
  const sp = item.splitPercent || 50;
  const iI = item.id;
  return `
    <div class="item-card">
      <div class="item-header">
        <span class="item-tag">Work Order For:</span>
        <input type="text" class="item-name-input" placeholder="Window 1, Cushions, etc."
               value="${esc(item.name)}" onchange="updateItemName(${iI},this.value)">
        <button class="btn btn-danger" onclick="removeItem(${iI})">✕</button>
      </div>
      <div class="item-body">
        <div class="item-col-details" style="flex:0 0 ${sp}%;">

          ${item.fields.map(f => renderField(iI, f)).join('')}
          <div class="add-btn-row">
            <button class="add-field-btn" onclick="addField(${iI},'text','','')">＋ Text</button>
            <button class="add-field-btn" onclick="addField(${iI},'textarea','','')">＋ Notes</button>
            <button class="add-field-btn" onclick="addField(${iI},'image','','')">＋ Image</button>
          </div>

            <button class="add-field-btn" onclick="addImageSlot(${iI})">＋ Image</button>
          </div>
        </div>
      </div>
    </div>`;
}

function fontGroup(label, iI, fI, fontSize, isBold, isItalic, isUnderline, prefix) {
  const p = prefix; // 'l' for label, '' for value
  const bProp = p ? 'lBold' : 'bold';

    return `

        <div class="font-toolbar">
          ${fontGroup('Label', iI, fI, lfs, field.lBold!==false, field.lItalic, field.lUnderline, 'l')}
          ${fontGroup('Value', iI, fI, fs, field.bold, field.italic, field.underline, '')}
        </div>
      </div>`;
  }
  const fs = field.fontSize || 14;
  const lfs = field.lFontSize || 12;
  const valStyle = `${field.bold?'font-weight:700;':''}${field.italic?'font-style:italic;':''}${field.underline?'text-decoration:underline;':''}font-size:${fs}px;`;
  const lblStyle = `${field.lBold!==false?'font-weight:700;':'font-weight:400;'}${field.lItalic?'font-style:italic;':''}${field.lUnderline?'text-decoration:underline;':''}font-size:${lfs}px;width:${lw}px;min-width:${lw}px;max-width:${lw}px;`;
  return `
    <div class="field-row" style="flex-wrap:wrap;">
      <textarea class="field-label-input" data-lbl="${fI}" rows="1" placeholder="Label" style="${lblStyle}"
             oninput="autoSize(this);updateField(${iI},${fI},'label',this.value)">${esc(field.label)}</textarea>
      <div class="label-resize-handle" onmousedown="startLabelResize(event,${iI},${fI})"></div>
      <textarea class="field-value-wrap" rows="1" data-val="${fI}" placeholder="Enter value here..." style="${valStyle}"
             oninput="autoSize(this);updateField(${iI},${fI},'value',this.value)">${esc(field.value)}</textarea>
      <button class="field-remove-btn" onclick="removeField(${iI},${fI})">✕</button>
      <div class="font-toolbar" style="width:100%;">
        ${fontGroup('Label', iI, fI, lfs, field.lBold!==false, field.lItalic, field.lUnderline, 'l')}
        ${fontGroup('Value', iI, fI, fs, field.bold, field.italic, field.underline, '')}
      </div>
    </div>`;
}

function renderImageSlot(itemId, img) {
  const iI = itemId, mI = img.id;
  const sc = img.scale || 100;
  const al = img.align || 'center';
  return `
    <div class="image-slot">
      <div class="image-slot-header">
        <input type="text" class="image-slot-label" placeholder="Image label (e.g. Fabric, Trim, Sketch...)"
               value="${esc(img.label)}" onchange="updateImageSlot(${iI},${mI},'label',this.value)">
        <button class="field-remove-btn" onclick="removeImageSlot(${iI},${mI})">✕</button>
      </div>
      <div class="image-drop-zone ${img.imageData?'has-image':''}"
           ondragover="event.preventDefault();this.classList.add('dragover')"
           ondragleave="this.classList.remove('dragover')"
           ondrop="handleImageDrop(event,${iI},${mI})"
           onclick="if(!${!!img.imageData})this.querySelector('input[type=file]').click()">
        ${img.imageData
          ? `<div data-imgwrap="${mI}" style="text-align:${al};width:100%;">
               <img data-img="${mI}" src="${img.imageData}" style="width:${sc}%;max-width:100%;">
             </div>`
          : '📷 Drop image or click'}
        <input type="file" accept="image/*" style="display:none;" onchange="handleImageSelect(event,${iI},${mI})">
      </div>
      ${img.imageData ? `
      <div class="image-controls">
        <label>SCALE</label>
        <input type="range" min="10" max="100" value="${sc}"
               oninput="updateImageScale(${iI},${mI},this.value)">
        <span class="scale-value" data-scale="${mI}">${sc}%</span>
        <label>ALIGN</label>
        <select onchange="updateImageAlign(${iI},${mI},this.value)">
          <option value="left" ${al==='left'?'selected':''}>Left</option>
          <option value="center" ${al==='center'?'selected':''}>Center</option>
          <option value="right" ${al==='right'?'selected':''}>Right</option>
        </select>
        <button class="btn btn-ghost" style="font-size:11px;padding:3px 10px;margin-left:4px;border:1px solid var(--mint);" onclick="event.stopPropagation();openCrop(${iI},${mI})">✂ Crop</button>
        <button class="btn btn-ghost" style="font-size:11px;padding:3px 10px;margin-left:2px;border:1px solid var(--mint);" onclick="event.stopPropagation();this.closest('.image-slot').querySelector('input[type=file]').click()">↻ Replace</button>
      </div>` : `
      <div class="or-divider">— OR PASTE URL —</div>
      <div class="image-url-row">
        <input type="url" placeholder="https://example.com/image.jpg" value="${esc(img.url)}"
               onchange="updateImageSlot(${iI},${mI},'url',this.value)">
        <button class="btn btn-ghost" style="font-size:11px;" onclick="loadImageURL(${iI},${mI})">Load</button>
      </div>`}
    </div>`;
}

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════
// CLEAR / NEW
// ═══════════════════════════════════════
function clearForm() {
  if (!confirm('Start a new blank work order? Unsaved changes will be lost.')) return;
  state.items = [];
  idCounter = 0;
  document.getElementById('woTitle').value = 'WINDOW TREATMENT WORK ORDER';
  document.getElementById('jobName').value = '';
  document.getElementById('roomName').value = '';
  document.getElementById('email').value = '';
  document.getElementById('orderDate').valueAsDate = new Date();
  document.getElementById('clientPhone').value = '';
  document.getElementById('designer').value = '';
  document.getElementById('installAddress').value = '';
  addItem();
  showToast('New work order');
}

// ═══════════════════════════════════════
// DRAFTS
// ═══════════════════════════════════════
function gatherFormData() {
  return {
    title: document.getElementById('woTitle').value,
    jobName: document.getElementById('jobName').value,
    roomName: document.getElementById('roomName').value,
    email: document.getElementById('email').value,
    orderDate: document.getElementById('orderDate').value,
    clientPhone: document.getElementById('clientPhone').value,
    designer: document.getElementById('designer').value,
    installAddress: document.getElementById('installAddress').value,
    items: state.items
  };
}

function saveDraft() {
  const data = gatherFormData();
  const drafts = JSON.parse(localStorage.getItem('sri_drafts2') || '[]');
  const name = data.jobName || data.title || 'Untitled';
  drafts.unshift({ id: Date.now(), name, date: new Date().toLocaleString(), data });
  localStorage.setItem('sri_drafts2', JSON.stringify(drafts));
  showToast('Draft saved: ' + name);
  renderDrafts();
}

function loadDraft(draftId) {
  const drafts = JSON.parse(localStorage.getItem('sri_drafts2') || '[]');
  const draft = drafts.find(d => d.id === draftId);
  if (!draft) return;
  const d = draft.data;
  state.items = d.items || [];
  idCounter = 0;
  state.items.forEach(i => { if (i.id > idCounter) idCounter = i.id; i.fields.forEach(f => { if (f.id > idCounter) idCounter = f.id; }); (i.images||[]).forEach(m => { if (m.id > idCounter) idCounter = m.id; }); });
  document.getElementById('woTitle').value = d.title || '';
  document.getElementById('jobName').value = d.jobName || '';
  document.getElementById('roomName').value = d.roomName || '';
  document.getElementById('email').value = d.email || '';
  document.getElementById('orderDate').value = d.orderDate || '';
  document.getElementById('clientPhone').value = d.clientPhone || '';
  document.getElementById('designer').value = d.designer || '';
  document.getElementById('installAddress').value = d.installAddress || '';
  render();
  toggleDrafts();
  showToast('Loaded: ' + draft.name);
}

function deleteDraft(draftId, event) {
  event.stopPropagation();
  if (!confirm('Delete this draft?')) return;
  let drafts = JSON.parse(localStorage.getItem('sri_drafts2') || '[]');
  drafts = drafts.filter(d => d.id !== draftId);
  localStorage.setItem('sri_drafts2', JSON.stringify(drafts));
  renderDrafts();
  showToast('Draft deleted');
}

function renderDrafts() {
  const list = document.getElementById('draftsList');
  const drafts = JSON.parse(localStorage.getItem('sri_drafts2') || '[]');
  if (!drafts.length) { list.innerHTML = '<div class="empty-hint">No saved drafts yet</div>'; return; }
  list.innerHTML = drafts.map(d => `
    <div class="draft-item" onclick="loadDraft(${d.id})">
      <div class="draft-item-title">${esc(d.name)}</div>
      <div class="draft-item-meta">${d.date}</div>
      <div class="draft-item-actions">
        <button class="btn btn-danger" onclick="deleteDraft(${d.id},event)" style="font-size:11px;">Delete</button>
      </div>
    </div>`).join('');
}

function toggleDrafts() {
  document.getElementById('draftsPanel').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('visible');
  renderDrafts();
}

function exportDrafts() {
  const drafts = JSON.parse(localStorage.getItem('sri_drafts2') || '[]');
  if (!drafts.length) { showToast('No drafts to export'); return; }
  const blob = new Blob([JSON.stringify(drafts, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sri-drafts-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Drafts exported (' + drafts.length + ' drafts)');
}

function importDrafts(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error('Invalid format');
      const existing = JSON.parse(localStorage.getItem('sri_drafts2') || '[]');
      const existingIds = new Set(existing.map(d => d.id));
      let added = 0;
      for (const draft of imported) {
        if (existingIds.has(draft.id)) {
          draft.id = Date.now() + '_' + Math.random().toString(36).slice(2,8);
          draft.name = (draft.name || 'Untitled') + ' (imported)';
        }
        existing.push(draft);
        existingIds.add(draft.id);
        added++;
      }
      localStorage.setItem('sri_drafts2', JSON.stringify(existing));
      renderDrafts();
      showToast('Imported ' + added + ' draft(s)');
    } catch(e) {
      showToast('Error: Invalid drafts file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ═══════════════════════════════════════
// EXPORT XLSX
// ═══════════════════════════════════════
async function exportXLSX() {
  if (typeof ExcelJS === 'undefined') { showToast('ExcelJS not loaded'); return; }
  const data = gatherFormData();
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Work Order');
  ws.columns = [{ width:4 },{ width:20 },{ width:26 },{ width:20 },{ width:26 },{ width:4 }];

  const hFill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2C2E2D'} };
  const hFont = { bold:true, color:{argb:'FFE0EDEB'}, size:11, name:'Calibri' };
  const vFont = { size:11, name:'Calibri', color:{argb:'FF2C2E2D'} };
  const gFill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF3ECD8'} };
  const rFill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF2C2E2D'} };
  const bdr = { top:{style:'thin',color:{argb:'FFC8CBCA'}}, bottom:{style:'thin',color:{argb:'FFC8CBCA'}}, left:{style:'thin',color:{argb:'FFC8CBCA'}}, right:{style:'thin',color:{argb:'FFC8CBCA'}} };

  let row = 1;
  try {
    const logoId = wb.addImage({ base64: LOGO_B64, extension:'jpeg' });
    ws.addImage(logoId, { tl:{col:1.2,row:0.2}, ext:{width:280,height:80} });
    row = 6;
  } catch(e) { row = 2; }

  ws.mergeCells(`B${row}:E${row}`);
  const tc = ws.getCell(`B${row}`);
  tc.value = data.title||'WORK ORDER';
  tc.font = { bold:true, size:16, name:'Calibri', color:{argb:'FF2C2E2D'} };
  tc.alignment = { horizontal:'center', vertical:'middle' };
  ws.getRow(row).height = 30;
  row += 2;

  const hfs = [
    ['JOB NAME:', data.jobName, 'ROOM:', data.roomName],
    ['EMAIL:', data.email, 'DATE:', data.orderDate],
    ['CLIENT PHONE:', data.clientPhone, 'DESIGNER:', data.designer]
  ];
  hfs.forEach(hf => {
    ws.getRow(row).height = 26;
    if (hf[0]) { const c = ws.getCell(`B${row}`); c.value=hf[0]; c.font=hFont; c.fill=hFill; c.border=bdr; }
    if (hf[0]) { const c = ws.getCell(`C${row}`); c.value=hf[1]; c.font=vFont; c.border=bdr; }
    if (hf[2]) { const c = ws.getCell(`D${row}`); c.value=hf[2]; c.font=hFont; c.fill=hFill; c.border=bdr; }
    if (hf[2]) { const c = ws.getCell(`E${row}`); c.value=hf[3]; c.font=vFont; c.border=bdr; }
    row++;
  });
  ws.getRow(row).height = 26;
  const iaL = ws.getCell(`B${row}`); iaL.value='INSTALL ADDRESS:'; iaL.font=hFont; iaL.fill=hFill; iaL.border=bdr;
  ws.mergeCells(`C${row}:E${row}`);
  const iaV = ws.getCell(`C${row}`); iaV.value=data.installAddress; iaV.font=vFont; iaV.border=bdr;
  row += 2;

  for (const item of data.items) {
      ws.mergeCells(`B${row}:E${row}`);
      const ih = ws.getCell(`B${row}`);
      ih.value = item.name||'Item';
      ih.font = { bold:true, size:12, name:'Calibri', color:{argb:'FF9A7A2E'} };
      ih.fill = gFill; ih.border = bdr;
      ws.getRow(row).height = 26;
      row++;

      for (const f of item.fields) {
        if (f.type === 'image' && f.imageData) {
          ws.mergeCells(`B${row}:E${row}`);
          const lc = ws.getCell(`B${row}`);
          lc.value = f.label ? f.label+':' : 'Image:';
          lc.font = { bold:true, size:11, name:'Calibri' };
          row++;
          try {
            const ext = f.imageData.includes('image/png')?'png':'jpeg';
            const imgId = wb.addImage({ base64:f.imageData.split(',')[1], extension:ext });
            ws.addImage(imgId, { tl:{col:1.2,row:row-0.8}, ext:{width:250,height:180} });
            for(let i=0;i<10;i++) ws.getRow(row+i).height=18;
            row+=10;
          } catch(e) { ws.getCell(`B${row}`).value='[Image error]'; row++; }
          continue;
        }
        const lc = ws.getCell(`B${row}`);
        lc.value = f.label ? f.label+':' : '';
        lc.font = { bold:true, size:11, name:'Calibri' };
        ws.mergeCells(`C${row}:E${row}`);
        const vc = ws.getCell(`C${row}`);
        vc.value = f.value; vc.font = vFont;
        if (f.type==='textarea') vc.alignment = { wrapText:true, vertical:'top' };
        ws.getRow(row).height = f.type==='textarea' ? Math.max(26,16*(f.value.split('\n').length)) : 22;
        row++;
      }

      for (const img of (item.images||[])) {
        if (img.imageData) {
          ws.mergeCells(`B${row}:E${row}`);
          const lc = ws.getCell(`B${row}`);
          lc.value = img.label ? img.label+':' : 'Image:';
          lc.font = { bold:true, size:11, name:'Calibri' };
          row++;
          try {
            const ext = img.imageData.includes('image/png')?'png':'jpeg';
            const imgId = wb.addImage({ base64:img.imageData.split(',')[1], extension:ext });
            ws.addImage(imgId, { tl:{col:1.2,row:row-0.8}, ext:{width:250,height:180} });
            for(let i=0;i<10;i++) ws.getRow(row+i).height=18;
            row+=10;
          } catch(e) { ws.getCell(`B${row}`).value='[Image error]'; row++; }
        }
      }
      row++;
  }

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  saveAs(blob, (data.jobName||'WorkOrder').replace(/[^a-zA-Z0-9]/g,'_')+'.xlsx');
  showToast('Exported!');
}

// ═══════════════════════════════════════
// TOAST
// ═══════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2500);
}

// ═══════════════════════════════════════
// PAGE BREAK INDICATOR
// ═══════════════════════════════════════
let _pageBreaksOn = false;
function togglePageBreaks() {
  _pageBreaksOn = !_pageBreaksOn;
  const btn = document.getElementById('pageBreakBtn');
  if (btn) {
    btn.style.background = _pageBreaksOn ? 'rgba(184,148,62,0.25)' : '';
    btn.style.borderColor = _pageBreaksOn ? 'rgba(184,148,62,0.6)' : '';
    btn.style.color = _pageBreaksOn ? 'var(--gold-light)' : '';
  }
  document.querySelectorAll('.page-break-indicator').forEach(el => el.remove());
  if (!_pageBreaksOn) return;
  const container = document.querySelector('.container');
  if (!container) return;
  // US Letter with 0.25in margins: usable height = 10.5in × 96dpi = 1008px
  // The print container has no padding (padding: 0 in @media print).
  // On screen the container has 32px top padding — subtract that offset so
  // line 1 lands where the first page actually breaks in print.
  const PAGE_H = 1008;
  const SCREEN_TOP_PAD = 32;
  const totalH = container.scrollHeight;
  for (let page = 1; (page * PAGE_H - SCREEN_TOP_PAD) < totalH; page++) {
    const y = page * PAGE_H - SCREEN_TOP_PAD;
    const line = document.createElement('div');
    line.className = 'page-break-indicator';
    line.style.top = y + 'px';
    const lbl = document.createElement('span');
    lbl.className = 'page-break-indicator-label';
    lbl.textContent = `— PAGE ${page + 1} STARTS —`;
    line.appendChild(lbl);
    container.appendChild(line);
  }
}

// ═══════════════════════════════════════
// PRINT PREP
// ═══════════════════════════════════════
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('textarea').forEach(ta => {
    const div = document.createElement('div');
    div.className = ta.className + ' print-swap';
    div.style.cssText = ta.style.cssText;
    div.style.overflow = 'visible';
    div.style.height = 'auto';
    div.style.maxHeight = 'none';
    div.style.whiteSpace = 'pre-wrap';
    div.style.wordWrap = 'break-word';
    div.style.minHeight = '0';
    div.textContent = ta.value;
    if (ta.dataset.lbl) div.dataset.lbl = ta.dataset.lbl;
    if (ta.dataset.val) div.dataset.val = ta.dataset.val;
    ta.style.display = 'none';
    ta._printDiv = div;
    ta.parentNode.insertBefore(div, ta.nextSibling);
  });
});
window.addEventListener('afterprint', () => {
  document.querySelectorAll('.print-swap').forEach(div => div.remove());
  document.querySelectorAll('textarea').forEach(ta => {
    ta.style.display = '';
  });
  autoSizeAll();
});

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
addItem();
renderDrafts();
</script>
